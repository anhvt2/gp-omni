<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">GP-Omni — Gaussian processes. More possibilities.</title>
  <desc id="desc">The GP-Omni orbital icon and wordmark sit beside a stylized Gaussian process curve. A mint uncertainty band narrows near observations, and a coral point suggests the next experiment. This is a conceptual illustration, not benchmark data.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b30"/>
      <stop offset="1" stop-color="#1a2946"/>
    </linearGradient>
    <linearGradient id="orbit" x1="44" y1="160" x2="164" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="band" x1="680" y1="0" x2="1224" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4" stop-opacity=".06"/>
      <stop offset=".55" stop-color="#5eead4" stop-opacity=".25"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#background)"/>
  <g fill="none" stroke="#cbd5e1" stroke-opacity=".07">
    <path d="M680 80H1224 M680 150H1224 M680 220H1224 M680 290H1224 M680 360H1224"/>
    <path d="M720 60V380 M820 60V380 M920 60V380 M1020 60V380 M1120 60V380 M1220 60V380"/>
  </g>
  <g transform="translate(48 32)">
    <circle cx="80" cy="80" r="55" fill="none" stroke="url(#orbit)" stroke-width="6"/>
    <path d="M34 95 C52 91 54 43 74 49 S98 96 126 56 L126 92 C99 123 94 80 74 74 S53 111 34 111Z" fill="#5eead4" fill-opacity=".18"/>
    <path d="M34 103 C52 102 54 57 74 62 S98 110 126 74" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="52" cy="86" r="4.5" fill="#f1f5f9"/>
    <circle cx="87" cy="76" r="4.5" fill="#f1f5f9"/>
    <circle cx="126" cy="74" r="7" fill="#fb927e" stroke="#101b30" stroke-width="2.5"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="224" y="127" fill="#f1f5f9" font-size="58" font-weight="700" letter-spacing="-2">GP-Omni</text>
    <text x="72" y="235" fill="#f1f5f9" font-size="38" font-weight="600" letter-spacing="-1">Gaussian processes.</text>
    <text x="72" y="287" fill="#5eead4" font-size="38" font-weight="600" letter-spacing="-1">More possibilities.</text>
    <text x="74" y="365" fill="#b8c8de" font-size="17" letter-spacing="2">MODEL · LEARN · EXPLORE</text>
  </g>
  <path d="M680 224 C730 220 758 244 790 238 S851 104 900 99 S962 214 1018 179 S1124 38 1224 70 L1224 288 C1124 206 1073 246 1018 205 S948 255 900 139 S823 267 790 254 S727 341 680 326Z" fill="url(#band)"/>
  <path d="M680 275 C730 280 758 250 790 246 S851 109 900 119 S962 245 1018 192 S1124 86 1224 179" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
  <g fill="#f1f5f9" stroke="#101b30" stroke-width="3">
    <circle cx="790" cy="246" r="7"/>
    <circle cx="900" cy="119" r="7"/>
    <circle cx="1018" cy="192" r="7"/>
  </g>
  <path d="M1135 112V350" stroke="#fb927e" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="5 7"/>
  <circle cx="1135" cy="112" r="16" fill="#fb927e" fill-opacity=".14"/>
  <circle cx="1135" cy="112" r="7" fill="#fb927e" stroke="#101b30" stroke-width="3"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
    <text x="1075" y="380" fill="#fb927e">What comes next?</text>
    <circle cx="736" cy="413" r="4" fill="#f1f5f9"/>
    <text x="749" y="418" fill="#b8c8de">Observed</text>
    <path d="M850 413H874" stroke="#5eead4" stroke-width="3"/>
    <text x="883" y="418" fill="#b8c8de">Predicted mean</text>
    <rect x="1035" y="407" width="20" height="12" rx="3" fill="#5eead4" fill-opacity=".25"/>
    <text x="1064" y="418" fill="#b8c8de">Uncertainty</text>
  </g>
</svg>
