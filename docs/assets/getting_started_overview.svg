<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370" role="img" aria-labelledby="title desc">
<title id="title">Three dimensions of experimental design</title>
<desc id="desc">Analytical curves show biased cheap responses and target responses. A feasible Pareto curve excludes designs with x above 0.65. Three worker timelines show evaluations overlapping and free slots being refilled. Illustrations are conceptual, not benchmarks.</desc>
